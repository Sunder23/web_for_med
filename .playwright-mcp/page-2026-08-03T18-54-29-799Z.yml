        - generic [ref=f1e45]:
          - heading "Контроль якості даних" [level=3] [ref=f1e46]
          - paragraph [ref=f1e47]: "Стежимо, щоб аналітика не “брехала”: без дублювань, технічного сміття та “фантомних” конверсій."
    - generic [ref=f1e50]:
      - generic [ref=f1e51]:
        - generic [ref=f1e52]:
          - heading "Що входить до пакета аналітики та моніторингу" [level=2] [ref=f1e53]
          - generic [ref=f1e54]:
            - heading "1. Налаштування GA4 та Google Tag Manager" [level=3] [ref=f1e55]
            - paragraph [ref=f1e56]: Робимо так, щоб сайт не просто збирав “хіти”, а розумів, що для вас є цінною дією.
            - list [ref=f1e57]:
              - listitem [ref=f1e58]: "Налаштування Google Analytics 4 під медичний сайт: перегляди ключових сторінок; події “натиснув номер телефону”, “відправив форму”, “записався на прийом”; можна окремо виділяти звернення з конкретних напрямків (стоматологія, естетика, репродуктологія, реабілітація тощо)."
              - listitem [ref=f1e59]: "Налаштування Google Tag Manager: акуратний збір подій без “зашивання” кодів у шаблони сайту; зручне подальше розширення (нові форми, кнопки, сервіси запису)."
              - listitem [ref=f1e60]: "Перевірка коректності: чи точно подія спрацьовує там, де потрібно, й чи не рахується двічі."
            - heading "2. Дашборди та звітність (Looker Studio або інші інструменти)" [level=3] [ref=f1e61]
            - paragraph [ref=f1e62]: Дані мають бути не тільки зібрані, а й зрозуміло показані.
            - list [ref=f1e63]:
              - listitem [ref=f1e64]: "Збір ключових показників в одному місці: відвідування; звернення (дзвінки, форми, записи); розріз по каналам (Google пошук, реклама, прямі заходи, рекомендації); розріз по напрямкам (за сторінками послуг чи групами послуг)."
              - listitem [ref=f1e65]: "Інтерфейс, який може читати керівник, а не тільки аналітик: графіки динаміки; таблиці з основними зрізами; окремі блоки по пріоритетних напрямках."
              - listitem [ref=f1e66]: Можливість додати дані з рекламних кабінетів, якщо ви користуєтесь Google Ads.
            - heading "3. Моніторинг якості даних" [level=3] [ref=f1e67]
            - paragraph [ref=f1e68]: Навіть добре налаштована аналітика з часом “ламається”, якщо за нею ніхто не стежить.
            - list [ref=f1e69]:
              - listitem [ref=f1e70]: "Регулярна перевірка: чи не “відвалилися” скрипти після змін на сайті; чи не з’явилися дублікати подій; чи не виріс різко внутрішній/бот-трафік."
              - listitem [ref=f1e71]: "Актуальність цілей: якщо ви змінюєте форми, сервіси запису чи структуру сайту — оновлюємо відповідні події й звіти."
              - listitem [ref=f1e72]: "Простий формат звіту: що не так, чим це небезпечно для рішень, що зроблено для виправлення."
            - heading "4. Інтерпретація даних та рекомендації" [level=3] [ref=f1e73]
            - paragraph [ref=f1e74]: Цифри самі по собі не вирішують проблеми, якщо не зрозуміти, що з ними робити.
            - list [ref=f1e75]:
              - listitem [ref=f1e76]: "Пояснюємо не мовою “сесії/події/сегменти”, а мовою бізнесу: які напрями ростуть; які сторінки працюють краще/гірше; які канали дають звернення, а не тільки перегляди."
              - listitem [ref=f1e77]: "Рекомендації: що має сенс посилити (SEO, реклама, конкретні сторінки); які ідеї можна тимчасово відкласти; де потрібні зміни на сайті (форма, текст, структура)."
              - listitem [ref=f1e78]: "Зв’язуємо цифри з реальними подіями: зміна графіка лікаря, запуск/зупинка реклами, сезонність."
        - generic [ref=f1e79]:
          - heading "Чому в медицині особливо важливо мати нормальну аналітику" [level=2] [ref=f1e80]
          - generic [ref=f1e81]:
            - paragraph [ref=f1e82]: У медичному бізнесі помилка в оцінці каналів — це не тільки про “бюджет”, це про завантаження лікарів і планування.
            - list [ref=f1e83]:
              - listitem [ref=f1e84]:
                - strong [ref=f1e85]: Ви працюєте з живими графіками лікарів і записом.
                - text: Треба розуміти, що буде з навантаженням через 1–3 місяці, а не “колись потім”.
              - listitem [ref=f1e86]:
                - strong [ref=f1e87]: Різні напрямки дають різний чек і LTV.
                - text: Звернення по профілактиці, по естетиці, по реабілітації або репродуктології мають різну цінність. Аналітика має це відображати.
              - listitem [ref=f1e88]:
                - strong [ref=f1e89]: Велика роль “офлайн-факторів”.
                - text: "Поганий запис по телефону, конфлікт на ресепшені, відсутність відповіді на листи — усе це впливає на конверсії. Без аналітики важко відокремити: де проблема в сайті/каналах, а де — в процесах."
              - listitem [ref=f1e90]:
                - strong [ref=f1e91]: Чутливість до регулювання й етики.
                - text: Деякі інструменти реклами в медицині обмежені. Тому особливо важливо правильно оцінювати ті канали, які можна використовувати.
        - generic [ref=f1e92]:
          - heading "Що ми НЕ робимо в аналітиці (але про це чесно говоримо)" [level=2] [ref=f1e93]
          - generic [ref=f1e94]:
            - paragraph [ref=f1e95]: Важливо окреслити межі, щоб не обіцяти “зайвого”.
            - list [ref=f1e96]:
              - listitem [ref=f1e97]: Не збираємо й не зберігаємо медичні діагнози та чутливі дані пацієнтів у аналітичних інструментах.
              - listitem [ref=f1e98]: Не будуємо системи, які суперечать вимогам конфіденційності та законодавству (GDPR тощо).
              - listitem [ref=f1e99]: Не “домальовуємо” показники заради красивих презентацій — дані мають відповідати реальності, інакше втрачається сенс аналітики.
        - generic [ref=f1e100]:
          - heading "Як виглядає робота по кроках" [level=2] [ref=f1e101]
          - generic [ref=f1e102]:
            - heading "1. Аудит поточної аналітики" [level=3] [ref=f1e103]
