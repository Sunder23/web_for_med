              - generic [ref=f1e30]: "Аналітика та моніторинг для медичних сайтів: бачити не трафік, а пацієнтів"
        - 'heading "Аналітика та моніторинг для медичних сайтів: бачити не трафік, а пацієнтів" [level=1] [ref=f1e31]'
        - paragraph [ref=f1e32]: У медицині мало просто “налити трафік” на сайт. Важливо розуміти, з яких каналів приходять реальні пацієнти, які сторінки дають записи, а які лише перегляди. Ми налаштовуємо аналітику так, щоб ви бачили ланцюжок “канал → сторінка → звернення → напрямок/лікар” і могли приймати рішення на цифрах, а не на відчуттях.
      - generic [ref=f1e35]:
        - generic [ref=f1e37]:
          - heading "Фокус на записах, а не тільки на відвідуваннях" [level=3] [ref=f1e38]
          - paragraph [ref=f1e39]: Відстежуємо дзвінки, форми та звернення, а не просто “кліки”.
        - generic [ref=f1e41]:
          - heading "Прозорі звіти по напрямках" [level=3] [ref=f1e42]
