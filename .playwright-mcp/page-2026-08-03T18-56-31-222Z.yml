          - paragraph [ref=f6e43]: "На цьому етапі людина:"
          - list [ref=f6e44]:
            - listitem [ref=f6e45]:
              - text: ще
              - strong [ref=f6e46]: не знає нічого про центр
              - text: ","
            - listitem [ref=f6e47]: не розуміє, чим саме клініка займається,
            - listitem [ref=f6e48]: не бачить гарантій, команди, напрямків.
          - paragraph [ref=f6e49]:
            - text: Тобто перша дія, яку від нього вимагали, —
            - strong [ref=f6e50]: зробити вибір, до чого він ще не готовий
            - text: ". Це створювало напруження й зайву плутанину: замість довіри й зрозумілого першого кроку — відразу “обери адресу”."
          - paragraph [ref=f6e51]: "Додатково:"
          - list [ref=f6e52]:
            - listitem [ref=f6e53]:
              - text: у шапці був
              - strong [ref=f6e54]: масивний набір пунктів меню
              - text: ": “Напрямки, Клініки, Лікарі, Ціни, Про нас, Блог, Контакти” — усе впереміш, без чітких пріоритетів;"
