        - generic [ref=f6e59]:
          - heading "1. Прибрали бар’єр на вході" [level=3] [ref=f6e60]
          - paragraph [ref=f6e61]:
            - text: Перше рішення —
            - strong [ref=f6e62]: забрати модальне вікно з вибором клініки при заході на сайт
            - text: .
          - paragraph [ref=f6e63]: "Замість того, щоб змушувати людину одразу обирати адресу, ми:"
          - list [ref=f6e64]:
