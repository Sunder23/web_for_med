            - listitem [ref=f6e90]: створює враження живого, сучасного медичного закладу.
          - paragraph [ref=f6e91]: Одне чітке відео на фоні + зрозумілий заголовок і кнопка дії працюють краще, ніж 3–4 слайди з різними меседжами.
          - heading "4. Прописали шлях пацієнта" [level=3] [ref=f6e92]
