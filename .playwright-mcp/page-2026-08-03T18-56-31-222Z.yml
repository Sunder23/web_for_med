            - strong [ref=f6e69]: не перекриває весь екран
            - text: і не блокує перше знайомство.
          - heading "2. Перебудували навігацію" [level=3] [ref=f6e70]
          - paragraph [ref=f6e71]:
            - text: Попередня шапка “все в одному ряду” вимагала надто багато уваги від користувача. Ми переробили меню так, щоб
            - strong [ref=f6e72]: на першому плані були саме послуги
            - text: .
          - paragraph [ref=f6e73]: "Зміни:"
          - list [ref=f6e74]:
