              - text: ", щоб не перевантажувати перший екран."
          - paragraph [ref=f6e79]: "Так користувач одразу розуміє:"
          - blockquote [ref=f6e80]:
            - paragraph [ref=f6e81]: “Тут є потрібні мені медичні послуги. Ось, де їх знайти.”
          - paragraph [ref=f6e82]: А вже потім, за потреби, може перейти до деталей про конкретну клініку, лікарів чи статті.
          - heading "3. Замінили слайдер на відео" [level=3] [ref=f6e83]
          - paragraph [ref=f6e84]: "Слайдер із кількома банерами рідко працює добре: людина бачить лише один слайд, решта пролітає фоном."
          - paragraph [ref=f6e85]:
