# Explicit project name: keeps container/volume naming stable regardless of
# this file's location (default would be the compose file's directory, "docker").
# Must stay "web_for_med" to reuse the existing web_for_med_db_data / web_for_med_wordpress_data volumes.
name: web_for_med

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${WORDPRESS_DB_NAME}
      MYSQL_USER: ${WORDPRESS_DB_USER}
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      # Dev-only: -p on the command line is visible via `docker inspect`. Do not reuse in production.
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.24
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "${WP_PORT}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX}
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('SCRIPT_DEBUG', true);
        define('DISALLOW_FILE_EDIT', true);
        define('WP_HOME', 'http://localhost:${WP_PORT}');
        define('WP_SITEURL', 'http://localhost:${WP_PORT}');
    volumes:
      - wordpress_data:/var/www/html
      - ../theme/vite-wordpress-starter-theme:/var/www/html/wp-content/themes/vite-wordpress-starter-theme
      - ../mu-plugins:/var/www/html/wp-content/mu-plugins
      - ../plugin:/var/www/html/wp-content/plugins/starter-plugin
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/www/html/wp-load.php"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PMA_PORT}:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

  wpcli:
    image: wordpress:cli
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_healthy
    user: "33:33"
    volumes:
      - wordpress_data:/var/www/html
      - ../theme/vite-wordpress-starter-theme:/var/www/html/wp-content/themes/vite-wordpress-starter-theme
      - ../plugin:/var/www/html/wp-content/plugins/starter-plugin
      - ../scripts:/scripts
      - ../ref/images:/import-images:ro
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX}

volumes:
  db_data:
  wordpress_data:
